# =============================================================================
# config.cfg - Configuración general de IR-LG-Remote
# =============================================================================
# Parámetros globales de la aplicación: tiempos, pausas, macros y opciones
# de comportamiento. Formato: CLAVE=valor  (una por línea, # para comentarios).
#
# El proyecto se basa en el protocolo NEC a 38 kHz; los tiempos aquí definidos
# se usan como valores por defecto cuando no los sobreescribe el hardware.cfg.

# -----------------------------------------------------------------------------
# Modulación y portadora
# -----------------------------------------------------------------------------
# Frecuencia de la portadora IR en kHz (receptor estándar 38 kHz).
CARRIER_KHZ=38

# Periodo de la portadora en microsegundos (26.3 µs para 38 kHz).
# Se genera por software: mitad alta + mitad baja (13 µs + 13 µs).
CARRIER_PERIOD_US=26

# Mitad del periodo: tiempo en alto y en bajo de cada ciclo.
CARRIER_HALF_PERIOD_US=13

# -----------------------------------------------------------------------------
# Temporización NEC (microsegundos)
# -----------------------------------------------------------------------------
# Secuencia de inicio de trama: burst largo + espacio largo.
NEC_START_BURST_US=9000
NEC_START_SPACE_US=4500

# Marco de repetición NEC (tecla mantenida).
NEC_REPEAT_SPACE_US=2250

# Bit "0": 562 µs de burst + 562 µs de espacio.
NEC_BIT_0_BURST_US=562
NEC_BIT_0_SPACE_US=562

# Bit "1": 562 µs de burst + 1687 µs de espacio.
NEC_BIT_1_BURST_US=562
NEC_BIT_1_SPACE_US=1687

# Bit de parada (fin de trama).
NEC_STOP_BURST_US=562

# -----------------------------------------------------------------------------
# Repeticiones y pausas
# -----------------------------------------------------------------------------
# Número de repeticiones por defecto al enviar una tecla (0 = trama única).
DEFAULT_REPEATS=0

# Pausa entre teclas dentro de una macro, en milisegundos.
MACRO_PAUSE_MS=50

# Tiempo de espera del modo --learn antes de abortar, en segundos.
LEARN_TIMEOUT_S=15

# -----------------------------------------------------------------------------
# Macros predefinidas
# -----------------------------------------------------------------------------
# Formato: MACRO_<nombre>=<tecla1>,<tecla2>,...
# Se ejecutan con:  ./bin/App --macro <nombre>
#
# Macro de ejemplo: encender la TV y subir el volumen.
MACRO_encender_tv=POWER,VOLUME_UP,VOLUME_UP
MACRO_apagar_tv=POWER
MACRO_mute=MUTE
MACRO_subir_volumen=VOLUME_UP,VOLUME_UP,VOLUME_UP,VOLUME_UP
MACRO_bajar_volumen=VOLUME_DOWN,VOLUME_DOWN,VOLUME_DOWN,VOLUME_DOWN
MACRO_canal_siguiente=CHANNEL_UP
MACRO_canal_anterior=CHANNEL_DOWN