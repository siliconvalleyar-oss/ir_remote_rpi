# =============================================================================
# hardware.cfg - Definición del hardware conectado a la Raspberry Pi
# =============================================================================
# Parámetros de hardware del emulador IR-LG-Remote. Formato: CLAVE=valor.
#
# La numeración de pines es la BCM (Broadcom), la misma que usa bcm2835:
#   - GPIO 22  -> emisor IR (LED + transistor NPN)
#   - GPIO 17  -> receptor IR (VS1838B), solo para modo --learn
#   - I2C-1    -> pantalla OLED SSD1306 (SDA=GPIO 2, SCL=GPIO 3)

# -----------------------------------------------------------------------------
# GPIO del emisor IR (LED infrarrojo a través de transistor NPN)
# -----------------------------------------------------------------------------
# Pin al que va conectada la base del transistor que maneja el LED IR.
# Por defecto GPIO 22 (físico 15 del conector de 40 pines).
IR_TX_GPIO=22

# -----------------------------------------------------------------------------
# GPIO del receptor IR (VS1838B) - opcional, usado en modo --learn
# -----------------------------------------------------------------------------
# Salida del sensor VS1838B (colector abierto). En reposo el pin queda a nivel
# alto; durante una ráfaga IR cae a bajo. Requiere pull-up externo (10 kΩ).
IR_RX_GPIO=17

# -----------------------------------------------------------------------------
# Dirección NEC del control LG
# -----------------------------------------------------------------------------
# Los televisores LG usan típicamente la dirección NEC 0x04.
NEC_ADDRESS=4

# -----------------------------------------------------------------------------
# Pantalla OLED SSD1306 por I2C (opcional)
# -----------------------------------------------------------------------------
# Bus I2C (1 = /dev/i2c-1) y dirección del dispositivo en el bus.
OLED_I2C_BUS=1
OLED_I2C_ADDRESS=0x3C
# Resolución del display en píxeles (SSD1306 128x64).
OLED_WIDTH=128
OLED_HEIGHT=64

# -----------------------------------------------------------------------------
# Configuración del bus I2C (general)
# -----------------------------------------------------------------------------
# Velocidad del bus I2C en Hz (100000 = modo estándar). 400000 = fast mode.
I2C_CLOCK_HZ=400000