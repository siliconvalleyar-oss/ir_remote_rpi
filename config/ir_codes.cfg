# =============================================================================
# ir_codes.cfg - Tabla de códigos IR del mando LG (protocolo NEC)
# =============================================================================
# Cada línea define una tecla del mando y su código NEC de 8 bits (comando).
# Formato:  TECLA=0xNN   (una por línea, # para comentarios, espacios ignorados)
#
# La dirección NEC de estos códigos está fijada en config/hardware.cfg
# (NEC_ADDRESS=0x04 por defecto). La trama transmitida es:
#    addr(8) | ~addr(8) | cmd(8) | ~cmd(8)   [LSB primero]
#
# Para añadir o editar teclas NO hace falta recompilar: edite este archivo y
# vuelva a ejecutar la aplicación. Use  ./bin/App --list  para ver las cargas.

# --- Teclas básicas (dirección LG 0x04) --------------------------------------
POWER=0x08
VOLUME_UP=0x02
VOLUME_DOWN=0x03
MUTE=0x09
CHANNEL_UP=0x00
CHANNEL_DOWN=0x01
INPUT=0x0B
MENU=0x43
OK=0x44

# --- Flechas ----------------------------------------------------------------
UP=0x60
DOWN=0x6F
LEFT=0x61
RIGHT=0x75

# --- Dígitos (0-9) ----------------------------------------------------------
NUM_0=0x00
NUM_1=0x01
NUM_2=0x02
NUM_3=0x03
NUM_4=0x04
NUM_5=0x05
NUM_6=0x06
NUM_7=0x07
NUM_8=0x08
NUM_9=0x09

# --- Teclas adicionales -----------------------------------------------------
BACK=0x54
EXIT=0x5A
INFO=0x5F
GUIDE=0x80
SETTINGS=0x86
Q_VIEW=0xA4
SIMPLELP=0x42
MY_APPS=0x7D
LIST=0x62
RED=0x51
GREEN=0x52
YELLOW=0x53
BLUE=0x55